# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Force the runner to use Node.js 24.18.0
      - name: Setup Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      # 2. Pre-install the exact version of firebase-tools with the regression
      - name: Install specific firebase-tools version
        run: npm install -g firebase-tools@15.22.3

      - run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTPROJECTSWEB }}
          channelId: live
          projectId: ptprojectsweb